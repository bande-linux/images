name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apple-parts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bande-linux/system-scripts
          path: parts/system-scripts
      - uses: actions/checkout@v7
        with:
          repository: bande-linux/nvram
          path: parts/nvram
      - uses: actions/checkout@v7
        with:
          repository: bande-linux/bootloader
          submodules: recursive
          path: parts/bootloader
      - uses: actions/checkout@v7
        with:
          repository: bande-linux/u-boot
          ref: main
          fetch-depth: 1
          path: parts/u-boot
      - name: Build the Mac boot chain and packages
        run: ./apple-parts.sh parts apple-parts
      - uses: actions/upload-artifact@v7
        with:
          name: apple-parts
          path: apple-parts

  image:
    needs: apple-parts
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: apple, runner: ubuntu-24.04-arm, arch: arm64 }
          - { target: generic-arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { target: generic-amd64, runner: ubuntu-24.04, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: debian:testing
      options: --privileged --device /dev/kvm
    steps:
      - name: Prepare the container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git sudo ca-certificates
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: matrix.target == 'apple'
        with:
          name: apple-parts
          path: apple-parts
      - name: Install the build tools
        run: ./ci-setup.sh
      - name: Build the image
        run: |
          git config --global --add safe.directory "$PWD"
          if [ "${{ matrix.target }}" = apple ]; then
            export LOCAL_DEBS=$PWD/apple-parts/debs UNBOOT=$PWD/apple-parts/unboot.bin U_BOOT=$PWD/apple-parts/u-boot-nodtb.bin
          fi
          ./build.sh "${{ matrix.target }}" archive-key.asc out
      - name: Prove install and first start in QEMU
        if: matrix.target != 'apple'
        run: ./vm-test.py "${{ matrix.arch }}" out/bande-debian-testing-${{ matrix.target }}.img vm
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.target }}
          path: |
            out/*.img
            out/*.zip
            out/installer_data.json
          compression-level: 6
